name: IFT3913 core tests
# Job 1 (tâche 2) : exécute tous les tests de tika-core.
# Job 2 (tâche 3) : fait échouer l’exécution du workflow si un commit introduit une nouvelle vulnérabilité détectée par Semgrep.
on:
  workflow_dispatch:
  push:
    paths:
      - 'tika-core/**'
      - 'tika-serialization/**'
      - 'tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-pdf-module/**'
      - 'tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-microsoft-module/**'
      - 'tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-ocr-module/**'
      - '.github/workflows/ift3913-core-tests.yml'
  pull_request:
    paths:
      - 'tika-core/**'
      - 'tika-serialization/**'
      - 'tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-pdf-module/**'
      - 'tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-microsoft-module/**'
      - 'tika-parsers/tika-parsers-standard/tika-parsers-standard-modules/tika-parser-ocr-module/**'
      - '.github/workflows/ift3913-core-tests.yml'
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -pl tika-core -am test -DskipTests=false -Dmaven.test.skip=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports
          path: tika-core/target/surefire-reports/


  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Autoriser git dans le conteneur
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Vérifier les outils
        run: |
          semgrep --version
          git log --oneline -3

      - name: Trouver le commit de référence
        id: reference
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REFERENCE="${{ github.event.pull_request.base.sha }}"
          else
            REFERENCE="${{ github.event.before }}"
          fi
          if [ -z "$REFERENCE" ] || [ "$REFERENCE" = "0000000000000000000000000000000000000000" ]; then
            REFERENCE=$(git merge-base HEAD origin/tache2-final)
          fi
          echo "Commit de référence : $REFERENCE"
          echo "sha=$REFERENCE" >> "$GITHUB_OUTPUT"      
